<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PsychroMol</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🌱</text></svg>">
</head>
<body>

<header class="topbar">
  <button class="icon-button menu-toggle" id="menu-toggle" aria-label="Menu">
    <span class="icon">menu</span>
  </button>
  <div class="brand">PsychroMol</div>
  <button class="icon-button" id="connect-btn" aria-label="Server connection" title="Server connection">
    <span class="icon">cable</span>
  </button>
  <button class="profile-chip" id="profile-chip">
    <span class="chip-text">
      <span class="chip-name" id="chip-name">No profile</span>
      <span class="chip-sub" id="chip-sub">Tap to set up</span>
    </span>
    <span class="icon">expand_more</span>
  </button>
</header>

<div class="shell">
  <nav class="sidebar" id="sidebar">
    <button class="nav-item active" data-view="dashboard">
      <span class="icon">dashboard</span><span>Dashboard</span>
    </button>
    <button class="nav-item" data-view="chart">
      <span class="icon">scatter_plot</span><span>Psychro</span>
    </button>
    <div class="nav-label"><span class="icon">table_rows</span><span>Data</span></div>
    <button class="nav-item sub" data-view="data-chart">
      <span class="icon">show_chart</span><span>Chart</span>
    </button>
    <button class="nav-item sub" data-view="data-table">
      <span class="icon">table</span><span>Table</span>
    </button>
    <button class="nav-item" data-view="rules">
      <span class="icon">rule</span><span>Rules</span>
    </button>
  </nav>
  <div class="scrim" id="scrim"></div>

  <main class="content" id="content">

    <section class="view active" id="view-dashboard">
      <div class="cards" id="primary-cards"></div>
      <div id="advice-panel"></div>
      <h2 class="section-title">Charts</h2>
      <div class="chart-columns">
        <div class="panel">
          <div class="panel-head">
            <span class="row"><span id="mini-chart-title">Psychrometric</span><button class="help" data-help="topic:psychrometric-chart" id="mini-chart-help" aria-label="Reference">?</button></span>
            <div class="switch" id="mini-switch">
              <button class="on" data-kind="psychrometric">Psychrometric</button>
              <button data-kind="mollier">Mollier</button>
            </div>
          </div>
          <div class="chart-scroll"><div id="mini-chart"></div></div>
        </div>
        <div class="panel">
          <div class="panel-head"><span>Last 24 hours</span></div>
          <div class="chart-scroll"><div id="mini-trend"></div></div>
        </div>
      </div>
    </section>

    <section class="view fill" id="view-chart">
      <div class="psychro-layout">
        <div class="panel fill-panel">
          <div class="panel-head">
            <div class="row">
              <div class="switch" id="full-switch">
                <button class="on" data-kind="psychrometric">Psychrometric</button>
                <button data-kind="mollier">Mollier</button>
              </div>
              <button class="help" data-help="topic:psychrometric-chart" id="full-chart-help" aria-label="Reference">?</button>
            </div>
            <span class="hint inline">Scroll to zoom · drag to pan · hover to read</span>
            <button class="ghost" id="chart-reset">
              <span class="icon">restart_alt</span> Reset view
            </button>
          </div>
          <div class="chart-fill"><div id="full-chart"></div></div>
          <div class="row playback-row">
            <button class="ghost" id="history-play">
              <span class="icon">play_arrow</span> Play history
            </button>
            <input type="range" id="history-scrub" min="0" max="0" value="0">
            <span class="hint inline" id="history-scrub-time"></span>
          </div>
        </div>
        <div class="panel point-panel">
          <div class="panel-head">
            <span>Current point</span>
            <span class="hint inline" id="point-time"></span>
          </div>
          <div class="point-list" id="point-detail"></div>
        </div>
      </div>
    </section>

    <section class="view fill" id="view-data-chart">
      <div class="panel fill-panel">
        <div class="panel-head">
          <div class="range-host"></div>
          <div class="row">
            <button class="ghost" data-open="columns">
              <span class="icon">tune</span> Columns
            </button>
            <button class="primary" data-open="download">
              <span class="icon">download</span> Download
            </button>
          </div>
        </div>
        <div class="chart-fill"><div id="data-trend"></div></div>
      </div>
    </section>

    <section class="view fill" id="view-data-table">
      <div class="panel fill-panel">
        <div class="panel-head">
          <div class="range-host"></div>
          <div class="row">
            <button class="ghost" data-open="columns">
              <span class="icon">tune</span> Columns
            </button>
            <button class="primary" data-open="download">
              <span class="icon">download</span> Download
            </button>
          </div>
        </div>
        <div class="table-fill" id="table-fill"><table id="data-table"></table></div>
        <div class="pager">
          <button class="icon-button" data-page="first" aria-label="First page"><span class="icon">first_page</span></button>
          <button class="icon-button" data-page="previous" aria-label="Previous page"><span class="icon">chevron_left</span></button>
          <span class="pager-text" id="pager-text"></span>
          <button class="icon-button" data-page="next" aria-label="Next page"><span class="icon">chevron_right</span></button>
          <button class="icon-button" data-page="last" aria-label="Last page"><span class="icon">last_page</span></button>
        </div>
      </div>
    </section>

    <section class="view" id="view-rules">
      <div class="panel">
        <div class="panel-head">
          <span class="row"><span id="rules-intro">Rules for this profile.</span><button class="help" data-help="topic:rules" aria-label="Reference">?</button></span>
          <div class="row">
            <button class="ghost" id="rules-reset">
              <span class="icon">restart_alt</span> Restore defaults
            </button>
            <button class="primary" id="rule-add">
              <span class="icon">add</span> New rule
            </button>
          </div>
        </div>
        <div id="rules-list"></div>
      </div>
    </section>

  </main>
</div>

<div class="modal" id="profile-modal" hidden>
  <div class="modal-card wide" id="profile-modal-card"></div>
</div>

<div class="modal" id="rule-modal" hidden>
  <div class="modal-card wide">
    <div class="modal-head">
      <h2 id="rule-modal-title">New rule</h2>
      <button class="icon-button" data-close><span class="icon">close</span></button>
    </div>
    <div class="modal-body" id="rule-form"></div>
  </div>
</div>

<div class="modal" id="download-modal" hidden>
  <div class="modal-card">
    <div class="modal-head">
      <h2>Download data</h2>
      <button class="icon-button" data-close><span class="icon">close</span></button>
    </div>
    <div class="modal-body" id="download-form"></div>
  </div>
</div>

<div class="modal" id="columns-modal" hidden>
  <div class="modal-card">
    <div class="modal-head">
      <h2>Show columns</h2>
      <button class="icon-button" data-close><span class="icon">close</span></button>
    </div>
    <div class="modal-body" id="columns-form"></div>
  </div>
</div>

<div class="modal" id="connect-modal" hidden>
  <div class="modal-card">
    <div class="modal-head">
      <h2>Server connection</h2>
      <button class="icon-button" data-close><span class="icon">close</span></button>
    </div>
    <div class="modal-body">
      <p class="tip">PsychroMol needs the address of the server that stores your readings.</p>
      <div class="field-row">
        <label class="field">Server address<input type="text" id="connect-url" placeholder="http://192.168.1.50:8888/api/v1"></label>
      </div>
      <p class="hint" id="connect-status"></p>
      <div class="form-actions">
        <button class="primary" id="connect-save">Connect</button>
      </div>
    </div>
  </div>
</div>

<div class="modal top" id="reference-modal" hidden>
  <div class="modal-card">
    <div class="modal-head">
      <h2 id="reference-title">Reference</h2>
      <button class="icon-button" data-close><span class="icon">close</span></button>
    </div>
    <div class="modal-body reference" id="reference-body"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
